name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The scripts only run on Windows, so Ubuntu alone would miss Windows-only breakage.
  pester:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pester contract tests
        shell: pwsh
        run: |
          Import-Module (./.github/scripts/Install-PinnedModule.ps1 -Name Pester -Version 5.7.1 -Sha256 4A27904C6814A5FBE4758F8E49861F6A1994AEE77B71165A5C43C0371BA6C580)
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = '.'
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.Run.Exit = $true
          Invoke-Pester -Configuration $cfg

  # Windows PowerShell 5.1 is the default shell on a fresh install; the pwsh jobs do not cover it.
  windows-powershell-5:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse every script under Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem . -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::$($errors[0].Message) (line $($errors[0].Extent.StartLineNumber))"
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
      - name: Run Pester contract tests under Windows PowerShell 5.1
        shell: powershell
        run: |
          Import-Module (./.github/scripts/Install-PinnedModule.ps1 -Name Pester -Version 5.7.1 -Sha256 4A27904C6814A5FBE4758F8E49861F6A1994AEE77B71165A5C43C0371BA6C580)
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = '.'
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.Run.Exit = $true
          Invoke-Pester -Configuration $cfg

  psscriptanalyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module (./.github/scripts/Install-PinnedModule.ps1 -Name PSScriptAnalyzer -Version 1.25.0 -Sha256 14E634C828EB98EFB9F40B2918BA90F139ED5ECCDF663A2A747736D996995D60)
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -in 'Error','Warning') { exit 1 }
      - name: Verify pinned SHA-256 hashes match committed files
        shell: pwsh
        run: |
          $checks = @(
            @{ File = 'sysmon/sysmonconfig-export.xml'; Script = 'sysmon/install-sysmon.ps1'; Pat = "configSha256\s*=\s*'([A-F0-9]{64})'" }
            @{ File = 'sysmon/install-sysmon.ps1';      Script = 'setup.ps1';                 Pat = "sysmonScriptSha256\s*=\s*'([A-F0-9]{64})'" }
            @{ File = 'hardening/harden-extras.ps1';    Script = 'setup.ps1';                 Pat = "hardenScriptSha256\s*=\s*'([A-F0-9]{64})'" }
            @{ File = 'devdrive/setup-devdrive.ps1';    Script = 'setup.ps1';                 Pat = "devDriveScriptSha256\s*=\s*'([A-F0-9]{64})'" }
          )
          $ok = $true
          foreach ($c in $checks) {
            $m   = Select-String -Path $c.Script -Pattern $c.Pat
            $pin = if ($m) { $m.Matches[0].Groups[1].Value } else { $null }
            $actual = (Get-FileHash $c.File -Algorithm SHA256).Hash
            if (-not $pin)            { Write-Host "::error::no SHA-256 pin found in $($c.Script)"; $ok = $false }
            elseif ($pin -ne $actual) { Write-Host "::error::$($c.File) hash drift - pin=$pin actual=$actual"; $ok = $false }
            else                      { Write-Host "OK  $($c.File) matches pin" }
          }
          if (-not $ok) { exit 1 }
      - name: Verify pinned external downloads
        shell: pwsh
        run: |
          $setup = Get-Content -Raw setup.ps1
          function Get-Pin([string]$Name) {
            if ($setup -match "\`$$Name\s*=\s*'([^']+)'") { return $Matches[1] }
            throw "no `$$Name in setup.ps1"
          }
          $nvimCommit = Get-Pin 'nvimInstallerCommit'
          $pspCommit  = Get-Pin 'pspCommit'
          $checks = @(
            @{ Url = "https://github.com/26zl/nvim/raw/$nvimCommit/install.ps1"; Sha = Get-Pin 'nvimInstallerSha256' }
            @{ Url = "https://github.com/26zl/PowerShellPerfect/raw/$pspCommit/setup.ps1"; Sha = Get-Pin 'pspSetupSha256' }
            @{ Url = "https://github.com/neovim/neovim/releases/download/$(Get-Pin 'nvimTarballVersion')/nvim-linux-x86_64.tar.gz"; Sha = Get-Pin 'nvimTarballSha256' }
            # A moving branch: this fails when AndyFul ships a new build, before setup.ps1 would.
            @{ Url = Get-Pin 'cdUrl'; Sha = Get-Pin 'cdSha256' }
          )
          $ok = $true
          $tmp = Join-Path ([IO.Path]::GetTempPath()) 'pinned-download.bin'
          foreach ($c in $checks) {
            Invoke-WebRequest -Uri $c.Url -OutFile $tmp
            $actual = (Get-FileHash -LiteralPath $tmp -Algorithm SHA256).Hash
            if ($actual -ne $c.Sha) { Write-Host "::error::$($c.Url) is $actual, the pin is $($c.Sha)"; $ok = $false }
            else                    { Write-Host "OK  $($c.Url)" }
          }
          # PowerShellPerfect's bundle hash, computed the way its own setup.ps1 does.
          $files = [ordered]@{ profile = 'Microsoft.PowerShell_profile.ps1'; theme = 'theme.json'; terminal = 'terminal-config.json' }
          $parts = foreach ($key in $files.Keys) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/26zl/PowerShellPerfect/$pspCommit/$($files[$key])" -OutFile $tmp
            "${key}:$((Get-FileHash -LiteralPath $tmp -Algorithm SHA256).Hash)"
          }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bundle = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($parts -join ':'))).Replace('-', '')
          if ($bundle -ne (Get-Pin 'pspBundleSha256')) { Write-Host "::error::PowerShellPerfect bundle at $pspCommit is $bundle"; $ok = $false }
          else                                        { Write-Host "OK  PowerShellPerfect bundle at $pspCommit" }
          if (-not $ok) { exit 1 }

  # Runs the scripts that change the system for real, which is only safe on a throwaway runner.
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The hardening pass changes nothing when every answer is n
        shell: powershell
        run: |
          $snapshot = {
            $state = [ordered]@{}
            try {
              $p = Get-MpPreference -ErrorAction Stop
              $state.AsrIds      = @($p.AttackSurfaceReductionRules_Ids) -join ','
              $state.AsrActions  = @($p.AttackSurfaceReductionRules_Actions) -join ','
              $state.Exclusions  = (@($p.ExclusionPath) + @($p.ExclusionProcess) + @($p.ExclusionExtension)) -join ','
              $state.Quarantine  = $p.QuarantinePurgeItemsAfterDelay
            } catch { $state.Defender = 'unavailable' }
            foreach ($key in 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules',
                             'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Quarantine',
                             'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer',
                             'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa',
                             'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters') {
              $item = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
              if ($item) { $state[$key] = ($item.PSObject.Properties | Where-Object Name -notlike 'PS*' | ForEach-Object { "$($_.Name)=$($_.Value -join ',')" }) -join ';' }
            }
            Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces' -ErrorAction SilentlyContinue | ForEach-Object {
              $state[$_.PSChildName] = (Get-ItemProperty -LiteralPath $_.PSPath -Name NetbiosOptions -ErrorAction SilentlyContinue).NetbiosOptions
            }
            $state.Shares = (Get-SmbShare -ErrorAction SilentlyContinue | ForEach-Object Name | Sort-Object) -join ','
            $state.Logs   = (Get-ChildItem "$env:LOCALAPPDATA\windows-setup\logs" -ErrorAction SilentlyContinue | ForEach-Object Name) -join ','
            $state | ConvertTo-Json -Depth 3
          }
          $before = & $snapshot
          1..40 | ForEach-Object { 'n' } | powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\hardening\harden-extras.ps1
          $after = & $snapshot
          if ($before -ne $after) {
            Write-Host '::error::harden-extras.ps1 changed something although every answer was n'
            Compare-Object ($before -split "`n") ($after -split "`n") | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
            exit 1
          }
          Write-Host 'OK  nothing changed and nothing was written'
      - name: Install Sysmon for real, re-run it, and keep a larger log
        shell: powershell
        run: |
          $channel = 'Microsoft-Windows-Sysmon/Operational'
          # stdout only: under this step's 'stop' preference, Windows PowerShell turns merged stderr lines into errors.
          $first = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\sysmon\install-sysmon.ps1 | Out-String
          Write-Host $first
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::install-sysmon.ps1 failed (exit $LASTEXITCODE)"; exit 1 }
          if ($first -match 'staged but not active') { Write-Host '::warning::the built-in Sysmon feature needs a reboot on this image; the install was not exercised'; exit 0 }
          wevtutil.exe sl $channel /ms:2147483648
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\sysmon\install-sysmon.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the re-run failed (exit $LASTEXITCODE)"; exit 1 }
          $max = (Get-WinEvent -ListLog $channel).MaximumSizeInBytes
          if ($max -lt 2147483648) { Write-Host "::error::the re-run shrank the Sysmon log to $max bytes"; exit 1 }
          $svc = Get-CimInstance Win32_Service -Filter "Name='Sysmon' OR Name='Sysmon64'" | Select-Object -First 1
          if (-not $svc -or $svc.State -ne 'Running') { Write-Host '::error::Sysmon is not running'; exit 1 }
          $left = @(Get-ChildItem (Join-Path $env:SystemRoot 'Temp') -Directory -Filter 'windows-setup-*' -ErrorAction SilentlyContinue)
          if ($left) { Write-Host "::error::staging folders left behind: $($left.Name -join ', ')"; exit 1 }
          Write-Host "OK  $($svc.Name) running, log kept at $max bytes, no staging folder left"
      - name: Create a Dev Drive for real, move a projects folder onto it, and re-run it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $state = (fsutil devdrv query 2>&1) -join ' '
          if ([Environment]::OSVersion.Version.Build -lt 22621 -or $state -notmatch 'Developer volumes are enabled' -or
              -not (Get-Command Format-Volume).Parameters.ContainsKey('DevDrive')) {
            Write-Host "::warning::this runner cannot create a Dev Drive ($state); setup-devdrive.ps1 was not exercised"
            exit 0
          }
          # A small projects folder: one repository with a commit, an uncommitted change and node_modules.
          $src = Join-Path $env:RUNNER_TEMP 'Projects'
          $repo = Join-Path $src 'demo'
          $null = New-Item -ItemType Directory -Path (Join-Path $repo 'node_modules\left-pad') -Force
          Set-Content (Join-Path $repo 'node_modules\left-pad\index.js') 'module.exports = 1'
          Set-Content (Join-Path $repo '.gitignore') 'node_modules/'
          Set-Content (Join-Path $repo 'a.txt') 'one'
          git -C $repo init -q; git -C $repo add .; git -C $repo -c user.name=ci -c user.email=ci@example.invalid commit -qm init
          Set-Content (Join-Path $repo 'a.txt') 'two'
          $head = git -C $repo rev-parse HEAD
          $hadCargo = Test-Path (Join-Path $env:USERPROFILE '.cargo\bin\cargo.exe')
          # The script puts a shortcut there; make sure the runner's profile has a Desktop folder.
          $null = [Environment]::GetFolderPath('Desktop', 'Create')

          $vhd = Join-Path $env:RUNNER_TEMP 'DevDrive\DevDrive.vhdx'
          $first = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\devdrive\setup-devdrive.ps1 -VhdPath $vhd -SizeGB 50 -MoveProjectsFrom $src | Out-String
          Write-Host $first
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::setup-devdrive.ps1 failed (exit $LASTEXITCODE)"; exit 1 }

          $letter = [string](Get-DiskImage -ImagePath $vhd | Get-Disk | Get-Partition | Where-Object DriveLetter | Select-Object -First 1).DriveLetter
          if (-not $letter) { Write-Host '::error::the VHDX is not attached with a drive letter'; exit 1 }
          # One string: fsutil prints several lines, and -notmatch on an array returns the lines that do not match.
          $query = (fsutil devdrv query "${letter}:") -join ' '
          if ($query -notmatch 'This is a trusted developer volume') { Write-Host "::error::${letter}: is not a trusted Dev Drive ($query)"; exit 1 }
          if ($query -notmatch 'Filters allowed on any developer volume:\s+[^:]*SysmonDrv') { Write-Host "::error::SysmonDrv is not allowed on Dev Drives ($query)"; exit 1 }
          if ((Get-Volume -DriveLetter $letter).FileSystem -ne 'ReFS') { Write-Host '::error::the Dev Drive is not ReFS'; exit 1 }
          if (-not (Get-ScheduledTask -TaskPath '\DevDrive\' -TaskName 'Attach-DevDrive' -ErrorAction SilentlyContinue)) { Write-Host '::error::no attach task'; exit 1 }
          $cache = (Get-ItemProperty HKCU:\Environment).npm_config_cache
          if ($cache -ne "${letter}:\packages\npm") { Write-Host "::error::npm_config_cache is '$cache'"; exit 1 }
          $preCommit = (Get-ItemProperty HKCU:\Environment).PRE_COMMIT_HOME
          if ($preCommit -ne "${letter}:\packages\pre-commit") { Write-Host "::error::PRE_COMMIT_HOME is '$preCommit'"; exit 1 }
          if (-not (Select-String -LiteralPath "$env:LOCALAPPDATA\pnpm\config\rc" -SimpleMatch "cache-dir=${letter}:\packages\pnpm-cache" -Quiet)) { Write-Host "::error::pnpm's cache-dir is not on the Dev Drive"; exit 1 }
          # pnpm 11 reads only the pnpm_config_* variables for these.
          $pnpmEnv = Get-ItemProperty HKCU:\Environment
          if ($pnpmEnv.pnpm_config_store_dir -ne "${letter}:\packages\pnpm-store" -or $pnpmEnv.pnpm_config_cache_dir -ne "${letter}:\packages\pnpm-cache") { Write-Host '::error::pnpm_config_store_dir or pnpm_config_cache_dir is not on the Dev Drive'; exit 1 }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath('Desktop')) 'Prosjekter.lnk'))
          if ($shortcut.TargetPath -ne "${letter}:\Prosjekter") { Write-Host "::error::the Desktop shortcut points to '$($shortcut.TargetPath)'"; exit 1 }
          # rustup's proxies are symbolic links to rustup.exe; they must come along, not be skipped.
          if ($hadCargo -and -not (Test-Path "${letter}:\packages\cargo\bin\cargo.exe")) { Write-Host '::error::cargo.exe did not move with CARGO_HOME'; exit 1 }
          $link = Get-Item $src -Force
          if (-not ($link.Attributes -band [IO.FileAttributes]::ReparsePoint)) { Write-Host '::error::the old projects path is not a link'; exit 1 }
          $moved = "${letter}:\Prosjekter\demo"
          if ((git -c safe.directory=* -C $moved rev-parse HEAD) -ne $head) { Write-Host '::error::HEAD differs after the move'; exit 1 }
          if ((Get-Content (Join-Path $moved 'a.txt')) -ne 'two') { Write-Host '::error::the uncommitted change was lost'; exit 1 }
          if (Test-Path (Join-Path $moved 'node_modules')) { Write-Host '::error::node_modules was copied'; exit 1 }
          # The original is renamed on its own drive: into the profile when that is the same drive, else beside it.
          # Here the folder is on D: and the profile on C:, which is the case a plain Move-Item got wrong.
          $backupParent = if ((Split-Path -Qualifier $src) -eq (Split-Path -Qualifier $env:USERPROFILE)) { $env:USERPROFILE } else { Split-Path -Parent $src }
          $backup = @(Get-ChildItem $backupParent -Directory -Filter 'Projects-backup-*')
          if ($backup.Count -ne 1) { Write-Host "::error::expected one backup of the original folder in $backupParent, found $($backup.Count)"; exit 1 }
          if (-not (Test-Path (Join-Path $backup[0].FullName 'demo\.git')) -or (Get-Content (Join-Path $backup[0].FullName 'demo\a.txt')) -ne 'two') { Write-Host '::error::the backup is not the whole original'; exit 1 }

          $second = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\devdrive\setup-devdrive.ps1 -VhdPath $vhd -SizeGB 50 -MoveProjectsFrom $src | Out-String
          Write-Host $second
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the re-run failed (exit $LASTEXITCODE)"; exit 1 }
          # Every line the script prints when it changes something.
          if ($second -match '\(set\)|registered|marked as trusted|picks this up|new Dev Drive|copying |Desktop shortcut created|is now hidden') { Write-Host '::error::the re-run changed something'; exit 1 }
          Write-Host "OK  Dev Drive ${letter}: trusted, caches, projects and Desktop shortcut in place, re-run changed nothing"
