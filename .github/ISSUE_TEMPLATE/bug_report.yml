name: Bug report
description: A script does not work as its documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything that could be abused before it is fixed, report it privately through [GitHub Security Advisories](https://github.com/26zl/personal-windows-setup/security/advisories/new) instead.
  - type: dropdown
    id: script
    attributes:
      label: Script
      options:
        - setup.ps1
        - healthcheck/health-check.ps1
        - hardening/harden-extras.ps1
        - sysmon/install-sysmon.ps1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit SHA or tag you ran, or "main" and the date.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows and PowerShell
      description: For example "Windows 11 Pro 26H2 (26300), Windows PowerShell 5.1".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The relevant console output or log lines. Health-check reports and setup logs can contain user names, paths and network details, so remove what you do not want to share.
      render: text
